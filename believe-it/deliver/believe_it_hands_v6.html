<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Believe It — руки героя, лампа и топор</title>
<style>
  :root { --bg: #191919; --panel: #202020; --raise: #2a2a2a; --line: rgba(255,255,255,.2); --text: #fff; --muted: rgba(255,255,255,.65); --accent: #5E9FE8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .title { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .title b { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .title span { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: #151515; }
  button { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #333; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); min-height: 40px; padding: 0 14px; border-radius: 8px; }
  .tabs button[aria-selected="true"] { background: #333; color: var(--text); }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; touch-action: none; overflow: hidden; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #c { position: absolute; display: block; image-rendering: pixelated; }
  .lbl { position: absolute; left: 0; top: 0; padding: 3px 9px; border-radius: 6px; background: rgba(25,25,25,.78); color: var(--text); font-size: 12px; pointer-events: none; white-space: nowrap; }
  #stage:not([data-mode="model"]) .lbl { display: none; }
  .plbl { position: absolute; left: 0; top: 0; padding: 3px 8px; border-radius: 6px; background: rgba(25,25,25,.78); color: var(--text); font-size: 12px; pointer-events: none; white-space: nowrap; display: none; }
  #stage[data-mode="lamp"][data-explode="1"] .plbl[data-lamp-part] { display: block; }
  #stage[data-mode="axe"][data-explode="1"] .plbl[data-axe-part] { display: block; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar[hidden] { display: none; }
  .scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; max-width: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; }
  .chip .k { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,.12); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  button[aria-pressed="true"] { border-color: var(--accent); background: rgba(94,159,232,.2); }
  button[aria-pressed="true"] .k { background: var(--accent); color: #0d1b2b; }
  .tog { display: inline-flex; align-items: center; gap: 8px; }
  .tog::before { content: ""; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--muted); }
  .tog[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px #1d2a3a; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: auto; }
  #note { color: var(--muted); font-size: 12px; min-height: 16px; }
  .spacer { flex: 1; }
  @media (max-width: 560px) {
    header { padding: 6px 10px; }
    .title span { display: none; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 0 8px; }
    footer { padding: 8px 10px; }
    .meta { margin-left: 0; width: 100%; }
    .bar.wrap-sm { flex-wrap: nowrap; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <b>Believe It — PS1 3D ассеты</b>
    <span>Руки героя, керосиновая лампа и колун для дров</span>
  </div>
  <div class="tabs" role="tablist" aria-label="Режим просмотра">
    <button role="tab" data-mode="model" aria-selected="true">Руки</button>
    <button role="tab" data-mode="lamp" aria-selected="false" tabindex="-1">Лампа</button>
    <button role="tab" data-mode="axe" aria-selected="false" tabindex="-1">Топор</button>
    <button role="tab" data-mode="poses" aria-selected="false" tabindex="-1">Позы</button>
    <button role="tab" data-mode="game" aria-selected="false" tabindex="-1">В игре</button>
  </div>
</header>
<main id="stage" data-mode="model" data-explode="0">
  <canvas id="c"></canvas>
  <div class="lbl" id="lbl-l">Левая</div>
  <div class="lbl" id="lbl-r">Правая</div>
  <!-- Lamp parts -->
  <div class="plbl" data-lamp-part="bail">Дужка и ручка</div>
  <div class="plbl" data-lamp-part="hood">Колпак</div>
  <div class="plbl" data-lamp-part="guard">Сетка</div>
  <div class="plbl" data-lamp-part="glass">Стекло</div>
  <div class="plbl" data-lamp-part="burner">Горелка</div>
  <div class="plbl" data-lamp-part="tank">Бак</div>
  <div class="plbl" data-lamp-part="tubeR">Трубки</div>
  <!-- Axe parts -->
  <div class="plbl" data-axe-part="head">Железный обух</div>
  <div class="plbl" data-axe-part="wrap">Обмотка бечёвкой</div>
  <div class="plbl" data-axe-part="haft">Топорище (ясень)</div>
</main>
<footer>
  <div class="bar" id="bar-model">
    <button class="tog" id="t-wire" aria-pressed="false">Сетка</button>
    <button class="tog" id="t-spin" aria-pressed="true">Вращение</button>
    <button id="m-reset">Сбросить вид</button>
    <span class="meta" id="tris"></span>
  </div>
  <div class="bar" id="bar-lamp" hidden>
    <div class="scroll" id="lampst" role="group" aria-label="Состояние огня"></div>
    <button class="tog" id="l-ex" aria-pressed="false">Разобрать</button>
    <button class="tog" id="l-wire" aria-pressed="false">Сетка</button>
    <button class="tog" id="l-spin" aria-pressed="true">Вращение</button>
    <button id="l-reset">Сбросить вид</button>
    <span class="meta" id="l-tris"></span>
  </div>
  <div class="bar" id="bar-axe" hidden>
    <button class="tog" id="a-ex" aria-pressed="false">Разобрать</button>
    <button class="tog" id="a-wire" aria-pressed="false">Сетка</button>
    <button class="tog" id="a-spin" aria-pressed="true">Вращение</button>
    <button id="a-reset">Сбросить вид</button>
    <span class="meta" id="a-tris"></span>
  </div>
  <div class="bar wrap-sm" id="bar-poses" hidden>
    <div class="scroll" id="poses" role="group" aria-label="Поза"></div>
    <button id="p-reset">Вид от глаз</button>
  </div>
  <div class="bar wrap-sm" id="bar-game" hidden>
    <div class="scroll" id="game" role="group" aria-label="Сцена"></div>
    <button class="tog" id="t-vhs" aria-pressed="true">VHS</button>
  </div>
  <div id="note" aria-live="polite"></div>
</footer>
