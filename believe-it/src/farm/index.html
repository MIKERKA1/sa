<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Believe It — хутор Хинтеркайфек, март 1922</title>
<style>
  :root { --bg: #191919; --panel: #202020; --raise: #2a2a2a; --line: rgba(255,255,255,.2); --text: #fff; --muted: rgba(255,255,255,.65); --accent: #5E9FE8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .title { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .title b { font-size: 15px; font-weight: 600; }
  .title span { color: var(--muted); font-size: 12px; }
  .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: #151515; }
  button { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 14px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
  button:hover { background: #333; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); min-height: 40px; padding: 0 12px; }
  .seg button[aria-pressed="true"] { background: #333; color: var(--text); }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; touch-action: none; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; }
  #stage:active { cursor: grabbing; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .hud { position: absolute; pointer-events: none; color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.9); }
  #room { left: 12px; top: 10px; padding: 4px 10px; border-radius: 6px; background: rgba(20,20,20,.62); font-size: 13px; }
  #hint { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(20,20,20,.72); font-size: 14px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
  #hint:empty, #msg:empty { display: none; }
  #hint kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-right: 6px; border-radius: 5px; background: var(--accent); color: #0d1b2b; font: 600 12px system-ui, sans-serif; }
  #msg { left: 50%; top: 38%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 8px; background: rgba(20,20,20,.8); font-size: 14px; max-width: min(90%, 420px); text-align: center; }
  #dot { left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #stage[data-mode="orbit"] #dot, #stage[data-mode="orbit"] #hint, #stage[data-mode="orbit"] .touch { display: none; }
  .touch { position: absolute; display: none; }
  body.touch-ui .touch { display: block; }
  #joy { left: 16px; bottom: 16px; width: 128px; height: 128px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(20,20,20,.28); pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.28); }
  #tbtn { right: 14px; bottom: 16px; display: none; gap: 8px; flex-direction: column; align-items: flex-end; }
  body.touch-ui #tbtn { display: flex; }
  #tbtn button { min-width: 64px; min-height: 52px; background: rgba(30,30,30,.72); }
  body.touch-ui #hint { bottom: 156px; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
  @media (max-width: 900px) { .title { display: none; } }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar[hidden] { display: none; }
  .scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; max-width: 100%; flex-wrap: nowrap; }
  .scroll button { flex: none; }
  
  .lab { color: var(--muted); font-size: 12px; margin-right: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); background: rgba(94,159,232,.2); }
  .seg button[aria-pressed="true"] { border: 0; background: #333; }
  #help { color: var(--muted); font-size: 12px; min-height: 16px; }
  @media (max-width: 960px) { .title span { display: none; } .seg button { padding: 0 10px; } }
  @media (max-width: 560px) {
    header { padding: 6px 8px; } .title span { display: none; } .seg button { padding: 0 9px; }
    footer { padding: 6px 8px 8px; } #help { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="title"><b>Хутор Хинтеркайфек</b><span>Believe It · этап 3 · мир хутора, конец марта 1922</span></div>
  <div class="seg" role="group" aria-label="Режим">
    <button data-mode="walk" aria-pressed="true">Прогулка</button>
    <button data-mode="orbit" aria-pressed="false">Обзор</button>
  </div>
  <div class="seg" role="group" aria-label="Время суток">
    <button data-preset="day" aria-pressed="true">День</button>
    <button data-preset="dusk" aria-pressed="false">Сумерки</button>
    <button data-preset="night" aria-pressed="false">Ночь</button>
  </div>
  <div class="seg" role="group" aria-label="Графика">
    <button data-gfx="enh" aria-pressed="true">Улучшенная</button>
    <button data-gfx="retro" aria-pressed="false">Ретро</button>
  </div>
  <button id="b-snd" aria-pressed="true" title="Звуки хутора: куры, коровы, шаги, ветер">Звук</button>
</header>
<div id="stage" data-mode="walk">
  <canvas id="c"></canvas>
  <div class="hud" id="room"></div>
  <div class="hud" id="dot"></div>
  <div class="hud" id="msg" aria-live="polite"></div>
  <div class="hud" id="hint"></div>
  <div class="touch" id="joy"><i></i></div>
  <div class="touch" id="tbtn"><button id="b-lamp" aria-pressed="false">Лампа</button><button id="b-use">Действие</button></div>
</div>
<footer>
  <div class="bar" id="bar-cut" hidden>
    <span class="lab">Разрез</span>
    <div class="seg" role="group" aria-label="Разрез">
      <button data-cut="none" aria-pressed="true">Целиком</button>
      <button data-cut="attic" aria-pressed="false">Без крыши</button>
      <button data-cut="ground" aria-pressed="false">Первый этаж</button>
    </div>
  </div>
  <div class="bar"><div class="scroll" id="spots"><button id="b-hut-lock" aria-pressed="false" title="Проверка состояний: закрывает дверь будки">Замок будки: целый</button></div></div>
  <div id="help">WASD или стрелки — идти · Shift — бегом · тянуть мышью — осмотреться · E — дверь / лестница · L — лампа · звук включится после первого клика</div>
</footer>
<script type="module">/*__BUNDLE__*/</script>
</body>
</html>
